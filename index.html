<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random EndWord Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 700px;
            width: 100%;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 400;
            color: #888;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }
        #result {
            font-size: 2.2rem;
            font-weight: 700;
            min-height: 3.5rem;
            line-height: 1.6;
            word-break: keep-all;
            white-space: pre-wrap;
            margin-bottom: 2rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-align: center;
            transition: font-size 0.15s;
        }
        #result.empty { color: #555; font-size: 1rem; font-weight: 400; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        #result.shake { animation: shake 0.05s ease; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }
        .control-group label {
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 0.05em;
        }
        .control-group input {
            width: 80px;
            background: #111;
            border: 1px solid #333;
            color: #ccc;
            padding: 0.4rem 0.5rem;
            font-size: 0.85rem;
            text-align: center;
            outline: none;
        }
        .control-group input:focus { border-color: #666; }
        button {
            background: none;
            border: 1px solid #444;
            color: #ccc;
            padding: 0.7rem 2rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }
        button:hover { border-color: #fff; color: #fff; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .info {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RANDOM ENDWORD GENERATOR</h1>
        <div id="result" class="empty">데이터를 불러오는 중...</div>
        <div class="controls">
            <div class="control-group">
                <label>최대 단어 수</label>
                <input type="number" id="maxWords" value="30" min="1" max="100">
            </div>
            <div class="control-group">
                <label>최대 글자 수</label>
                <input type="number" id="maxChars" value="50" min="1" max="500">
            </div>
        </div>
        <button id="btn" disabled>GENERATE</button>
        <div class="info" id="info"></div>
    </div>
    <script>
        let startDict = {};
        let wordList = [];
        let animTimer = null;

        function overlapAppend(current, newWord) {
            const maxK = Math.min(current.length, newWord.length);
            for (let k = maxK; k > 0; k--) {
                if (current.endsWith(newWord.slice(0, k))) {
                    return newWord.slice(k);
                }
            }
            return newWord;
        }

        function isOneShot(word) {
            const lastChar = word[word.length - 1];
            return !startDict[lastChar] || startDict[lastChar].length === 0;
        }

        function pickNext(candidates) {
            const nonOneShot = candidates.filter(w => !isOneShot(w));
            const pool = nonOneShot.length > 0 ? nonOneShot : candidates;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function generateChain(maxWords, maxChars) {
            const start = wordList[Math.floor(Math.random() * wordList.length)];
            let result = start;
            const chain = [start];

            for (let i = 0; i < maxWords - 1; i++) {
                const lastChar = result[result.length - 1];
                const candidates = startDict[lastChar];
                if (!candidates || candidates.length === 0) break;

                const next = pickNext(candidates);
                const appended = overlapAppend(result, next);

                if (result.length + appended.length > maxChars) break;

                result += appended;
                chain.push(next);
            }
            return result;
        }

        function adjustFontSize(text) {
            const len = text.length;
            if (len <= 10) return '2.2rem';
            if (len >= 40) return '1.2rem';
            const size = 2.2 - (len - 10) * (1.0 / 30);
            return Math.max(1.2, size).toFixed(2) + 'rem';
        }

        function getCharsPerLine(fontSize) {
            const px = parseFloat(fontSize) * 16;
            const charWidth = px * 0.6;
            return Math.floor(660 / charWidth);
        }

        function formatText(text, fontSize) {
            const charsPerLine = getCharsPerLine(fontSize);
            const lines = [];
            for (let i = 0; i < text.length; i += charsPerLine) {
                lines.push(text.slice(i, i + charsPerLine));
            }
            return lines.join('\n');
        }

        function typeAnimate(element, text, fontSize, onComplete) {
            if (animTimer) clearTimeout(animTimer);
            element.textContent = '';
            element.style.fontSize = fontSize;

            let idx = 0;
            let currentLineLen = 0;
            const CHARS_PER_LINE = 20;

            function tick() {
                if (idx >= text.length) {
                    if (onComplete) onComplete();
                    return;
                }
                if (currentLineLen >= CHARS_PER_LINE) {
                    element.textContent += '\n';
                    currentLineLen = 0;
                }
                element.textContent += text[idx];
                currentLineLen++;
                idx++;

                if (navigator.vibrate) navigator.vibrate(10);
                element.classList.remove('shake');
                void element.offsetWidth;
                element.classList.add('shake');

                animTimer = setTimeout(tick, 30);
            }
            tick();
        }

        async function init() {
            try {
                const res = await fetch('words.json');
                startDict = await res.json();
                wordList = Object.values(startDict).flat();

                const btn = document.getElementById('btn');
                const result = document.getElementById('result');
                const info = document.getElementById('info');

                btn.disabled = false;
                result.textContent = '버튼을 눌러 생성하세요';
                info.textContent = `${wordList.length.toLocaleString()}개 단어 로드 완료`;

                btn.addEventListener('click', () => {
                    if (animTimer) clearTimeout(animTimer);

                    const maxWords = parseInt(document.getElementById('maxWords').value) || 30;
                    const maxChars = parseInt(document.getElementById('maxChars').value) || 50;

                    result.classList.remove('empty');
                    const text = generateChain(maxWords, maxChars);
                    const fontSize = adjustFontSize(text);
                    typeAnimate(result, text, fontSize);
                });
            } catch (e) {
                document.getElementById('result').textContent = '데이터 로드 실패';
            }
        }

        init();
    </script>
</body>
</html>
