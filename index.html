<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random EndWord Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 17px; }
        body {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            background: #050508;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(88, 40, 180, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(40, 100, 180, 0.06) 0%, transparent 50%);
            animation: bgDrift 20s ease-in-out infinite alternate;
            z-index: -1;
        }
        @keyframes bgDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(3%, -2%) rotate(2deg); }
        }
        .container {
            text-align: center;
            padding: 2rem 2.5rem 1.75rem;
            max-width: 720px;
            width: 100%;
            max-height: 96vh;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 18px;
            background: rgba(255,255,255,0.015);
            backdrop-filter: blur(20px);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .result-wrap {
            position: relative;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 2rem 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.012);
            display: flex;
            flex-direction: column;
        }
        .masthead {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 300;
            margin: 0;
            letter-spacing: 0.3em;
            background: linear-gradient(135deg, #8a7cc8, #5b9bd5, #8a7cc8);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShift 6s ease-in-out infinite alternate;
        }
        .tagline {
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 0.35em;
            text-transform: uppercase;
        }
        @keyframes titleShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        #particleCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #result {
            margin: auto 0;
            font-size: 2.2rem;
            font-weight: 700;
            min-height: 3.5rem;
            line-height: 1.8;
            word-break: keep-all;
            white-space: pre-wrap;
            color: #fff;
            letter-spacing: 0.08em;
            text-align: center;
            transition: font-size 0.15s;
            position: relative;
            z-index: 1;
        }
        #result.typing {
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.15);
        }
        #result.empty {
            color: #444;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #result .char {
            display: inline-block;
            opacity: 0;
            animation: charPop 0.3s ease forwards;
        }
        #result .char.glitch {
            text-shadow: 1px 0 rgba(255, 0, 64, 0.3), -1px 0 rgba(0, 255, 128, 0.3);
        }
        #result .char.custom-word {
            color: #d9c46a;
        }
        #result.slide-out {
            animation: slideOut 0.08s ease forwards;
        }
        #result.slide-in {
            animation: slideIn 0.12s ease forwards;
        }
        @keyframes charPop {
            0% { opacity: 0; transform: scale(1.6) translateY(-4px); filter: blur(4px); }
            60% { opacity: 1; transform: scale(1.05) translateY(0); filter: blur(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        @keyframes slideOut {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(-100%); }
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(100%); }
            100% { opacity: 1; transform: translateX(0); }
        }
        #container.glitching::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            z-index: 10;
            animation: sliceEffect 0.2s ease 2;
        }
        @keyframes sliceEffect {
            0% { transform: translateX(0); opacity: 0.5; }
            50% { transform: translateX(calc(50% - 5px)); opacity: 0.3; }
            100% { transform: translateX(0); opacity: 0; }
        }
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.9rem;
        }
        .panel {
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            padding: 1.4rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            text-align: left;
        }
        .panel-row {
            display: flex;
            align-items: flex-end;
            gap: 0.9rem;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .field-label {
            font-size: 0.6rem;
            color: #ccc;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .field input[type="number"] {
            width: 92px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: #ccc;
            padding: 0.55rem 0.5rem;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
            border-radius: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .field input[type="number"]:focus {
            border-color: rgba(138, 124, 200, 0.4);
            box-shadow: 0 0 12px rgba(138, 124, 200, 0.1);
        }
        .field.slider-field {
            display: grid;
            grid-template-columns: auto 1fr auto;
            grid-template-rows: auto auto;
            column-gap: 1rem;
            row-gap: 0.25rem;
            align-items: center;
        }
        .slider-field .field-label {
            grid-column: 1;
            grid-row: 1;
        }
        .field.slider-field input[type="range"] {
            grid-column: 1 / -1;
            grid-row: 2;
            width: 100%;
            accent-color: #8a7cc8;
        }
        .weight-label {
            grid-column: 3;
            grid-row: 1;
            font-size: 0.65rem;
            color: #777;
            letter-spacing: 0.05em;
        }
        .limit-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-bottom: 0.45rem;
            cursor: pointer;
        }
        .limit-toggle input[type="checkbox"] {
            width: auto;
            accent-color: #8a7cc8;
            cursor: pointer;
        }
        .toggle-label {
            font-size: 0.6rem;
            color: #666;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
        }
        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            padding: 0.75rem 2.5rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.2em;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s;
        }
        button:hover::before { left: 100%; }
        button:hover {
            border-color: rgba(138, 124, 200, 0.5);
            color: #ddd;
            box-shadow: 0 0 20px rgba(138, 124, 200, 0.1), inset 0 0 20px rgba(138, 124, 200, 0.03);
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.2; cursor: not-allowed; }
        button:disabled:hover { border-color: rgba(255,255,255,0.1); color: #aaa; box-shadow: none; }
        button:disabled:hover::before { left: -100%; }
        #btn {
            background: linear-gradient(135deg, rgba(138, 124, 200, 0.35), rgba(91, 155, 213, 0.25));
            border-color: rgba(138, 124, 200, 0.55);
            color: #fff;
            padding: 0.95rem 3rem;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            box-shadow: 0 0 28px rgba(138, 124, 200, 0.18), inset 0 0 24px rgba(138, 124, 200, 0.05);
        }
        #btn:hover {
            border-color: rgba(138, 124, 200, 0.8);
            box-shadow: 0 0 36px rgba(138, 124, 200, 0.28), inset 0 0 24px rgba(138, 124, 200, 0.08);
        }
        #copyBtn {
            padding: 0.55rem 1.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
        }
        #copyBtn.copied {
            border-color: rgba(100, 200, 120, 0.5);
            color: #6c8;
        }
        #instantBtn {
            padding: 0.55rem 1.5rem;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            opacity: 0.5;
        }
        #instantBtn:hover { opacity: 0.8; }
        .footer {
            margin-top: 0.25rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .info {
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 0.05em;
            text-align: left;
        }
        .footer .info:last-child {
            text-align: right;
        }
        .nav-link {
            margin-left: auto;
            font-size: 0.7rem;
            color: #777;
            text-decoration: none;
            letter-spacing: 0.1em;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .nav-link:hover {
            color: #ddd;
            border-color: rgba(138, 124, 200, 0.5);
        }
        #chainStatus.valid { color: #6c8; }
        #chainStatus.invalid { color: #e88; }
        @media (max-width: 600px) {
            .container { padding: 1.5rem 1.25rem; }
            h1 { font-size: 1.1rem; letter-spacing: 0.2em; }
            .panel-row { flex-wrap: wrap; }
            .actions { flex-wrap: wrap; }
            .footer { flex-direction: column; align-items: flex-start; gap: 0.4rem; }
            .footer .info:last-child { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <header class="masthead">
            <h1>RANDOM ENDWORD GENERATOR</h1>
            <p class="tagline">끝말잇기 무한 생성</p>
        </header>
        <div class="result-wrap">
            <canvas id="particleCanvas"></canvas>
            <div id="result" class="empty">데이터를 불러오는 중...</div>
        </div>
        <div class="panel">
            <div class="panel-row">
                <div class="field">
                    <label class="field-label">최대 단어 수</label>
                    <input type="number" id="maxWords" value="30" min="1" max="1000">
                </div>
                <div class="field">
                    <label class="field-label">최대 글자 수</label>
                    <input type="number" id="maxChars" value="50" min="1" max="5000">
                </div>
                <label class="limit-toggle">
                    <input type="checkbox" id="noLimit">
                    <span class="toggle-label">제한 X</span>
                </label>
                <a href="custom.html" class="nav-link">커스텀 단어 →</a>
            </div>
            <div class="field slider-field">
                <label class="field-label">커스텀 출현</label>
                <input type="range" id="customWeight" min="0" max="100" step="1" value="0">
                <span class="weight-label" id="customWeightLabel">0%</span>
            </div>
        </div>
        <div class="actions">
            <button id="instantBtn" disabled>결과 즉시 보기</button>
            <button id="btn" disabled>GENERATE</button>
            <button id="copyBtn" disabled>COPY</button>
        </div>
        <div class="footer">
            <div class="info" id="info"></div>
            <div class="info" id="chainStatus"></div>
        </div>
    </div>
    <script>
        let startDict = {};
        let wordList = [];
        let customWords = [];
        let animTimer = null;
        let currentText = '';
        let customWeight = 0;
        let customUsage = {};        // 커스텀 단어 -> 세션 내 배치 횟수
        let customPlacedTotal = 0;   // 세션 내 커스텀 배치 총합
        let customEndChars = new Set(); // 사전 단어의 끝 글자 집합 (도달 가능성 판정용)

        const COLORS = ['#5b9bd5', '#8a7cc8', '#d55b5b', '#5bd5a8', '#d5c85b', '#d58a5b', '#ff4444', '#ffaa00', '#ff00ff'];

        /* ── Particles ── */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let rafId = null;

        function resizeCanvas() {
            const wrap = canvas.parentElement;
            canvas.width = wrap.offsetWidth;
            canvas.height = wrap.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const MAX_PARTICLES_PER_FLASH = 18;

        function particleCountForText(textLength) {
            const base = 6;
            const scale = Math.min(textLength / 20, 1);
            return Math.floor(base + (MAX_PARTICLES_PER_FLASH - base) * scale);
        }

        function spawnParticles(x, y, count) {
            count = count || particleCountForText(currentText.length);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const isSpark = Math.random() < 0.4;
                const isEmber = Math.random() < 0.3;
                const isDebris = !isSpark && !isEmber;
                const speed = isSpark ? (2 + Math.random() * 6) : (0.5 + Math.random() * 2);
                const decay = isSpark ? 0.02 + Math.random() * 0.02 : (isDebris ? 0.005 + Math.random() * 0.01 : 0.01 + Math.random() * 0.02);
                const size = isSpark ? (1 + Math.random() * 1.5) : (isDebris ? (3 + Math.random() * 5) : (1.5 + Math.random() * 2.5));
                const vy = isEmber ? -(0.5 + Math.random() * 1.5) : (Math.sin(angle) * speed);
                const vx = Math.cos(angle) * (isEmber ? (0.3 + Math.random() * 0.5) : speed);
                particles.push({
                    x, y,
                    vx, vy,
                    life: 1,
                    decay,
                    size,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    type: isSpark ? 'spark' : (isEmber ? 'ember' : 'debris'),
                    gravity: isDebris ? 0.06 : (isSpark ? 0.02 : 0.04)
                });
            }
            if (!rafId) tickParticles();
        }

        function burstParticles(x, y, count) {
            count = count || particleCountForText(currentText.length);
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const isSpark = Math.random() < 0.5;
                const isEmber = Math.random() < 0.3;
                const isDebris = !isSpark && !isEmber;
                const speed = isSpark ? (2 + Math.random() * 4) : (0.5 + Math.random() * 1.5);
                const decay = isSpark ? 0.015 + Math.random() * 0.015 : (isDebris ? 0.005 + Math.random() * 0.008 : 0.01 + Math.random() * 0.015);
                const size = isSpark ? (1 + Math.random() * 1.5) : (isDebris ? (3 + Math.random() * 4) : (1.5 + Math.random() * 2));
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay,
                    size,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    type: isSpark ? 'spark' : (isEmber ? 'ember' : 'debris'),
                    gravity: isDebris ? 0.05 : (isSpark ? 0.01 : 0.03)
                });
            }
            if (!rafId) tickParticles();
        }

        function tickParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.life -= p.decay;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                const drawSize = p.type === 'spark' ? p.size : (p.size * p.life);
                ctx.arc(p.x, p.y, drawSize, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            if (particles.length > 0) {
                rafId = requestAnimationFrame(tickParticles);
            } else {
                rafId = null;
            }
        }

        /* ── Word chain logic ── */
        const MAX_WORD_LEN = 7;

        function overlapAppend(current, newWord) {
            const maxK = Math.min(current.length, newWord.length);
            for (let k = maxK; k > 0; k--) {
                if (current.endsWith(newWord.slice(0, k))) {
                    return newWord.slice(k);
                }
            }
            return newWord;
        }

        function isOneShot(word) {
            const lastChar = word[word.length - 1];
            return !startDict[lastChar] || startDict[lastChar].length === 0;
        }

        function compareWords(a, b) {
            return a < b ? -1 : a > b ? 1 : 0;
        }

        function binarySearchWord(sortedWords, word) {
            let lo = 0, hi = sortedWords.length - 1;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                const cmp = compareWords(word, sortedWords[mid]);
                if (cmp === 0) return mid;
                if (cmp < 0) hi = mid - 1;
                else lo = mid + 1;
            }
            return -1;
        }

        function insertWordSorted(sortedWords, word) {
            let lo = 0, hi = sortedWords.length;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (compareWords(word, sortedWords[mid]) < 0) hi = mid;
                else lo = mid + 1;
            }
            sortedWords.splice(lo, 0, word);
        }

        function pickNext(candidates, usedWords) {
            const nonOneShot = candidates.filter(w => !isOneShot(w));
            let pool = nonOneShot.length > 0 ? nonOneShot : candidates;
            pool = pool.filter(w => binarySearchWord(usedWords, w) === -1);
            if (pool.length === 0) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function generateBaseChain(maxWords, maxChars) {
            const usedWords = [];
            const start = wordList[Math.floor(Math.random() * wordList.length)];
            insertWordSorted(usedWords, start);
            let result = start;
            const chain = [start];

            for (let i = 0; i < maxWords - 1; i++) {
                const lastChar = result[result.length - 1];
                const candidates = startDict[lastChar];
                if (!candidates || candidates.length === 0) break;

                const next = pickNext(candidates, usedWords);
                if (!next) break;

                const appended = overlapAppend(result, next);

                if (result.length + appended.length > maxChars) break;

                result += appended;
                chain.push(next);
                insertWordSorted(usedWords, next);
            }
            return { text: result, chain, customRanges: [] };
        }

        function mergedLen(chain) {
            if (chain.length === 0) return 0;
            let total = chain[0].length;
            let tail = chain[0];
            for (let i = 1; i < chain.length; i++) {
                const w = chain[i];
                let o = 1;
                const maxK = Math.min(MAX_WORD_LEN, w.length, tail.length);
                for (let k = maxK; k > 0; k--) {
                    if (tail.endsWith(w.slice(0, k))) { o = k; break; }
                }
                total += w.length - o;
                tail = (tail + w.slice(o)).slice(-MAX_WORD_LEN);
            }
            return total;
        }

        /* ── Custom-word probability curve ──
           Slider 0..100 → probability 0..1 via x² curve.
           Quadratic keeps low slider values from accidentally producing
           30%+, and high values (≥80) approach saturation. */
        function customProbability(sliderValue) {
            const x = Math.max(0, Math.min(100, sliderValue)) / 100;
            return x * x;
        }

        function weightLabel(value) {
            return `${Math.round(value)}%`;
        }

        function generateWeightedChain(maxWords, maxChars, p) {
            const usedWords = [];
            const customSet = new Set(customWords);
            const isLive = w => {
                const c = w[w.length - 1];
                return startDict[c] && startDict[c].length > 0;
            };
            const customStarts = new Set(customWords.map(w => w[0]));
            // 도달 가능 커스텀만 회전 대상 (첫 글자가 사전 끝 글자인 단어)
            const customReachable = customEndChars.size > 0
                ? customWords.filter(w => customEndChars.has(w[0]))
                : customWords;
            const target = customPlacedTotal / (customReachable.length || 1);              // 누적 평균
            const dueWords = customReachable.filter(c => (customUsage[c] || 0) <= target); // 평균 이하 = 배치 예정
            const dueSet = new Set(dueWords);
            const dueStarts = new Set(dueWords.map(w => w[0]));

            // 시작 유도: due 커스텀의 첫 글자로 끝나는 사전 단어로 시작
            let start;
            if (p > 0 && customWords.length > 0) {
                let biased = wordList.filter(w => dueStarts.size > 0 ? dueStarts.has(w[w.length - 1]) : customStarts.has(w[w.length - 1]));
                if (biased.length === 0) biased = wordList.filter(w => customStarts.has(w[w.length - 1]));
                start = biased.length > 0
                    ? biased[Math.floor(Math.random() * biased.length)]
                    : wordList[Math.floor(Math.random() * wordList.length)];
            } else {
                start = wordList[Math.floor(Math.random() * wordList.length)];
            }
            insertWordSorted(usedWords, start);
            let result = start;
            const chain = [start];
            const customRanges = [];
            let customPlaced = 0;

            while (chain.length < maxWords) {
                const lastChar = result[result.length - 1];
                let next = null;

                if (p > 0 && customSet.size > 0 && Math.random() < p) {
                    const compat = customWords.filter(w =>
                        w[0] === lastChar
                        && binarySearchWord(usedWords, w) === -1
                        && result.length + overlapAppend(result, w).length <= maxChars);
                    const dueCompat = compat.filter(w => dueSet.has(w));                // 1) 직접 체인: due만 선택
                    if (dueCompat.length > 0) {
                        const live = dueCompat.filter(isLive);
                        const pool = live.length > 0 ? live : dueCompat;
                        let min = Infinity, best = [];
                        for (const w of pool) {
                            const u = customUsage[w] || 0;
                            if (u < min) { min = u; best = [w]; }
                            else if (u === min) best.push(w);
                        }
                        next = best[Math.floor(Math.random() * best.length)];           // 최소 사용 단어 선택 (균등 회전)
                    } else {
                        const candidates = startDict[lastChar];                         // 2) 브리지: due 커스텀 첫 글자로 끝나는 사전 단어
                        if (candidates) {
                            let pool = candidates.filter(w =>
                                binarySearchWord(usedWords, w) === -1
                                && customStarts.has(w[w.length - 1]));
                            if (pool.length > 0) {
                                const duePool = pool.filter(w => dueStarts.has(w[w.length - 1]));
                                if (duePool.length > 0) pool = duePool;
                                const liveB = pool.filter(isLive);
                                if (liveB.length > 0) pool = liveB;
                                if (pool.length > 0) next = pool[Math.floor(Math.random() * pool.length)];
                            }
                        }
                    }
                }

                if (!next) {                                                            // 3) 폴백: 기존 정상 선택
                    const candidates = startDict[lastChar];
                    if (!candidates || candidates.length === 0) break;
                    next = pickNext(candidates, usedWords);
                }
                if (!next) break;

                const appended = overlapAppend(result, next);
                if (result.length + appended.length > maxChars) break;

                const startIdx = result.length;
                result += appended;
                if (customSet.has(next)) {
                    customPlaced++;
                    customRanges.push({ start: startIdx, end: startIdx + appended.length });
                }
                chain.push(next);
                insertWordSorted(usedWords, next);
            }

            // 세션 균등 카운터 갱신
            for (const w of chain) {
                if (customSet.has(w)) {
                    customUsage[w] = (customUsage[w] || 0) + 1;
                    customPlacedTotal++;
                }
            }
            return { text: result, chain, customRanges };
        }

        function generateChain(maxWords, maxChars) {
            if (customWords.length === 0 || customWeight === 0) {
                return generateBaseChain(maxWords, maxChars);
            }
            const p = customProbability(customWeight);
            return generateWeightedChain(maxWords, maxChars, p);
        }

        function validateChain(chain) {
            const errors = [];
            if (chain.length < 2) errors.push('단어가 2개 이상 필요합니다');
            for (let i = 1; i < chain.length; i++) {
                const prev = chain[i - 1], curr = chain[i];
                if (curr[0] !== prev[prev.length - 1]) {
                    errors.push(`'${prev}'(${prev[prev.length - 1]}) → '${curr}'(${curr[0]}) 연결 오류`);
                }
            }
            const seen = new Set();
            for (const w of chain) {
                if (seen.has(w)) errors.push(`'${w}' 중복 사용`);
                seen.add(w);
            }
            return errors;
        }

        function showChainStatus(chain) {
            const el = document.getElementById('chainStatus');
            const errors = validateChain(chain);
            if (errors.length === 0) {
                el.textContent = `끝말잇기 검사: 유효 (${chain.length}단어)`;
                el.classList.add('valid');
                el.classList.remove('invalid');
            } else {
                el.textContent = `끝말잇기 검사: 오류 ${errors.length}건 — ${errors.slice(0, 3).join(' / ')}`;
                el.classList.add('invalid');
                el.classList.remove('valid');
            }
        }

        function adjustFontSize(text) {
            const len = text.length;
            if (len <= 10) return '2.2rem';
            if (len >= 40) return '1.2rem';
            const size = 2.2 - (len - 10) * (1.0 / 30);
            return Math.max(1.2, size).toFixed(2) + 'rem';
        }

        /* ── Typing animation with particles ── */
        function typeAnimate(element, text, fontSize, customRanges, onComplete) {
            if (animTimer) clearTimeout(animTimer);
            element.innerHTML = '';
            element.style.fontSize = fontSize;
            currentText = text;
            result.classList.add('typing');

            const customFlags = new Array(text.length).fill(false);
            if (customRanges) {
                for (const r of customRanges) {
                    for (let i = r.start; i < r.end && i < text.length; i++) customFlags[i] = true;
                }
            }

            let idx = 0;
            const CHARS_PER_LINE = 20;
            let lineLen = 0;
            const totalLen = text.length;

            function tick() {
                if (idx >= text.length) {
                    result.classList.remove('typing');
                    if (onComplete) onComplete();
                    return;
                }

                if (lineLen >= CHARS_PER_LINE) {
                    element.appendChild(document.createElement('br'));
                    lineLen = 0;
                }

                const span = document.createElement('span');
                span.className = 'char';
                if (customFlags[idx]) span.classList.add('custom-word');
                if (idx % 4 === 1) {
                    span.classList.add('glitch');
                    setTimeout(() => span.classList.remove('glitch'), 60 + Math.random() * 80);
                }
                span.textContent = text[idx];
                element.appendChild(span);
                lineLen++;
                idx++;


                if (idx === 1) {
                    const rect = span.getBoundingClientRect();
                    const canvasRect = canvas.getBoundingClientRect();
                    const cx = rect.left - canvasRect.left + rect.width / 2;
                    const cy = rect.top - canvasRect.top + rect.height / 2;
                    burstParticles(cx, cy, 12);
                } else {
                    const rect = span.getBoundingClientRect();
                    const canvasRect = canvas.getBoundingClientRect();
                    const cx = rect.left - canvasRect.left + rect.width / 2;
                    const cy = rect.top - canvasRect.top + rect.height / 2;
                    spawnParticles(cx, cy);
                }


                let delay;
                if (totalLen <= 10) {
                    delay = 25 + Math.random() * 15;
                } else {
                    const progress = idx / totalLen;
                    if (progress < 0.3) {
                        delay = 12 + Math.random() * 20;
                    } else if (progress < 0.5) {
                        delay = 30 + Math.random() * 20;
                    } else if (progress < 0.7) {
                        delay = 12 + Math.random() * 15;
                    } else if (progress < 0.85) {
                        delay = 10 + Math.random() * 10;
                    } else {
                        delay = 8 + Math.random() * 8;
                    }
                }

                animTimer = setTimeout(tick, delay);
            }
            tick();
        }

        /* ── Copy ── */
        document.getElementById('copyBtn').addEventListener('click', function() {
            if (!currentText) return;
            navigator.clipboard.writeText(currentText).then(() => {
                this.textContent = 'COPIED!';
                this.classList.add('copied');
                setTimeout(() => {
                    this.textContent = 'COPY';
                    this.classList.remove('copied');
                }, 1500);
            });
        });

        /* ── show result without animation ── */
        function showResultImmediate(element, text, fontSize, customRanges) {
            if (animTimer) clearTimeout(animTimer);
            element.classList.remove('slide-out', 'slide-in');
            element.innerHTML = '';
            element.style.fontSize = fontSize;
            currentText = text;

            element.classList.add('slide-in');
            setTimeout(() => element.classList.remove('slide-in'), 120);

            const customFlags = new Array(text.length).fill(false);
            if (customRanges) {
                for (const r of customRanges) {
                    for (let i = r.start; i < r.end && i < text.length; i++) customFlags[i] = true;
                }
            }

            const CHARS_PER_LINE = 20;
            let lineLen = 0;
            let i = 0;
            while (i < text.length) {
                if (lineLen >= CHARS_PER_LINE) {
                    element.appendChild(document.createElement('br'));
                    lineLen = 0;
                }
                const custom = customFlags[i];
                const remaining = CHARS_PER_LINE - lineLen;
                let j = i + 1;
                while (j < text.length && customFlags[j] === custom && (j - i) < remaining) j++;
                const span = document.createElement('span');
                span.className = 'char' + (custom ? ' custom-word' : '');
                span.textContent = text.slice(i, j);
                element.appendChild(span);
                lineLen += (j - i);
                i = j;
            }
        }

        /* ── get values considering no-limit checkbox ── */
        function getLimits() {
            const noLimit = document.getElementById('noLimit').checked;
            return {
                maxWords: noLimit ? 10000 : parseInt(document.getElementById('maxWords').value) || 30,
                maxChars: noLimit ? 999999 : parseInt(document.getElementById('maxChars').value) || 50
            };
        }

        /* ── Init ── */
        async function init() {
            try {
                const res = await fetch('words.json');
                startDict = await res.json();
                wordList = Object.values(startDict).flat();
                customEndChars = new Set(wordList.map(w => w[w.length - 1]));

                // Load custom words from localStorage (browser-local persistence)
                try {
                    const raw = JSON.parse(localStorage.getItem('endword.customWords.v1') || '[]');
                    if (Array.isArray(raw)) {
                        const seen = new Set();
                        customWords = [];
                        for (const w of raw) {
                            if (typeof w !== 'string') continue;
                            const t = w.trim();
                            if (t.length < 2 || /\s/.test(t)) continue;
                            if (seen.has(t)) continue;
                            seen.add(t);
                            customWords.push(t);
                        }
                    }
                } catch (e) {
                    console.warn('[endword] custom words load failed:', e);
                    customWords = [];
                }

                // Load custom word appearance weight from localStorage
                try {
                    const raw = parseInt(localStorage.getItem('endword.customWeight.v1'), 10);
                    customWeight = Number.isFinite(raw) ? Math.min(100, Math.max(0, raw)) : 0;
                } catch (e) {
                    customWeight = 0;
                }
                const weightSlider = document.getElementById('customWeight');
                const weightLabelEl = document.getElementById('customWeightLabel');
                weightSlider.value = customWeight;
                weightLabelEl.textContent = weightLabel(customWeight);
                weightSlider.addEventListener('input', (e) => {
                    customWeight = parseInt(e.target.value, 10);
                    try {
                        localStorage.setItem('endword.customWeight.v1', String(customWeight));
                    } catch (err) {
                        console.warn('[endword] custom weight save failed:', err);
                    }
                    weightLabelEl.textContent = weightLabel(customWeight);
                });

                const btn = document.getElementById('btn');
                const copyBtn = document.getElementById('copyBtn');
                const instantBtn = document.getElementById('instantBtn');
                const result = document.getElementById('result');
                const info = document.getElementById('info');

                btn.disabled = false;
                instantBtn.disabled = false;
                result.textContent = '버튼을 눌러 생성하세요';
                const customMsg = customWords.length > 0
                    ? ` + 커스텀 ${customWords.length}개`
                    : '';
                info.textContent = `${wordList.length.toLocaleString()}개${customMsg} 단어 로드 완료`;

                function doGenerate(animate) {
                    if (animTimer) clearTimeout(animTimer);
                    copyBtn.disabled = true;
                    const containerEl = document.getElementById('container');
                    containerEl.classList.remove('glitching');

                    const { maxWords, maxChars } = getLimits();

                    result.classList.remove('empty');
                    result.classList.remove('slide-in');

                    if (currentText && result.textContent.trim() && currentText !== result.textContent.trim()) {
                        result.classList.add('slide-out');
                        setTimeout(() => {
                            result.classList.remove('slide-out');
                            const { text, chain, customRanges } = generateChain(maxWords, maxChars);
                            const fontSize = adjustFontSize(text);

                            if (animate) {
                                containerEl.classList.add('glitching');
                                setTimeout(() => {
                                    containerEl.classList.remove('glitching');
                                }, 300);
                                typeAnimate(result, text, fontSize, customRanges, () => {
                                    showChainStatus(chain);
                                    copyBtn.disabled = false;
                                });
                            } else {
                                showResultImmediate(result, text, fontSize, customRanges);
                                showChainStatus(chain);
                                copyBtn.disabled = false;
                            }
                        }, 80);
                    } else {
                        const { text, chain, customRanges } = generateChain(maxWords, maxChars);
                        const fontSize = adjustFontSize(text);

                        if (animate) {
                                containerEl.classList.add('glitching');
                                setTimeout(() => {
                                    containerEl.classList.remove('glitching');
                                }, 300);
                                typeAnimate(result, text, fontSize, customRanges, () => {
                                showChainStatus(chain);
                                copyBtn.disabled = false;
                            });
                        } else {
                            showResultImmediate(result, text, fontSize, customRanges);
                            showChainStatus(chain);
                            copyBtn.disabled = false;
                        }
                    }
                }

                btn.addEventListener('click', () => doGenerate(true));
                instantBtn.addEventListener('click', () => doGenerate(false));
            } catch (e) {
                document.getElementById('result').textContent = '데이터 로드 실패';
            }
        }

        init();
    </script>
</body>
