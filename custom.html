<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커스텀 단어 관리 — EndWord</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #050508;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(88, 40, 180, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(40, 100, 180, 0.06) 0%, transparent 50%);
            animation: bgDrift 20s ease-in-out infinite alternate;
            z-index: -1;
        }
        @keyframes bgDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(3%, -2%) rotate(2deg); }
        }
        .container {
            max-width: 640px;
            width: 100%;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            background: rgba(255,255,255,0.015);
            backdrop-filter: blur(20px);
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 300;
            letter-spacing: 0.22em;
            background: linear-gradient(135deg, #8a7cc8, #5b9bd5, #8a7cc8);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShift 6s ease-in-out infinite alternate;
        }
        @keyframes titleShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        a.nav {
            font-size: 0.75rem;
            color: #888;
            text-decoration: none;
            letter-spacing: 0.1em;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.3s;
        }
        a.nav:hover {
            color: #ddd;
            border-color: rgba(138, 124, 200, 0.5);
        }
        .input-row {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.4rem;
            align-items: flex-start;
        }
        .input-row input {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e0e0e0;
            padding: 0.7rem 0.8rem;
            font-size: 0.95rem;
            outline: none;
            border-radius: 6px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-row input:focus {
            border-color: rgba(138, 124, 200, 0.4);
            box-shadow: 0 0 12px rgba(138, 124, 200, 0.1);
        }
        .input-row textarea {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e0e0e0;
            padding: 0.7rem 0.8rem;
            font-size: 0.95rem;
            line-height: 1.4;
            outline: none;
            border-radius: 6px;
            resize: none;
            overflow: hidden;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-row textarea:focus {
            border-color: rgba(138, 124, 200, 0.4);
            box-shadow: 0 0 12px rgba(138, 124, 200, 0.1);
        }
        .hint {
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }
        .error {
            font-size: 0.75rem;
            color: #e88;
            min-height: 1.2em;
            margin-bottom: 0.8rem;
            letter-spacing: 0.03em;
        }
        .search-row {
            margin-bottom: 1rem;
        }
        .search-row input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e0e0e0;
            padding: 0.55rem 0.8rem;
            font-size: 0.85rem;
            outline: none;
            border-radius: 6px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-row input:focus {
            border-color: rgba(138, 124, 200, 0.4);
            box-shadow: 0 0 12px rgba(138, 124, 200, 0.1);
        }
        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 0.05em;
            margin-bottom: 0.8rem;
        }
        .list {
            list-style: none;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.01);
            min-height: 6rem;
        }
        .empty-state {
            padding: 2rem 1rem;
            text-align: center;
            color: #444;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
        }
        .item:last-child { border-bottom: none; }
        .item:hover { background: rgba(255,255,255,0.02); }
        .item .word {
            flex: 1;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            color: #e0e0e0;
            word-break: break-all;
        }
        .item .word.editing {
            display: flex;
            gap: 0.4rem;
        }
        .item .word input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(138, 124, 200, 0.4);
            color: #e0e0e0;
            padding: 0.3rem 0.5rem;
            font-size: 0.9rem;
            outline: none;
            border-radius: 4px;
        }
        .actions {
            display: flex;
            gap: 0.4rem;
        }
        .btn-sm {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            padding: 0.35rem 0.75rem;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .btn-sm:hover {
            border-color: rgba(138, 124, 200, 0.5);
            color: #ddd;
        }
        .btn-sm.danger:hover {
            border-color: rgba(232, 136, 136, 0.5);
            color: #e88;
        }
        .btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            padding: 0.55rem 1.4rem;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: rgba(138, 124, 200, 0.5);
            color: #ddd;
        }
        .btn.ghost {
            background: transparent;
            border-color: rgba(255,255,255,0.08);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay[hidden] { display: none; }
        .modal {
            width: min(560px, 92vw);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            background: rgba(18,18,28,0.92);
            backdrop-filter: blur(20px);
        }
        .modal h2 {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #c9c3e8;
            margin-bottom: 0.5rem;
        }
        .modal-msg {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 0.03em;
            margin-bottom: 1rem;
        }
        #modalList {
            overflow-y: auto;
            min-height: 0;
            flex: 1 1 auto;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1.2rem;
        }
        .error.ok { color: #6c8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>커스텀 단어 관리</h1>
            <a href="index.html" class="nav">← 메인으로</a>
        </div>

        <div class="input-row">
            <textarea id="wordInput" rows="1" placeholder="단어를 입력하고 추가 버튼(또는 Ctrl+Enter)" autocomplete="off"></textarea>
            <button id="submitBtn" class="btn-sm">추가</button>
        </div>
        <div class="hint">2글자 이상, 공백 없이. 여러 단어는 줄바꿈된 텍스트를 붙여넣으면 자동 감지됩니다. Enter=바로 추가(한 줄)/새 줄(여러 줄), Ctrl+Enter 또는 추가 버튼=제출.</div>
        <div class="error" id="error"></div>

        <div class="search-row">
            <input type="search" id="searchInput" placeholder="검색..." autocomplete="off">
        </div>

        <div class="meta">
            <span id="count">총 0개</span>
            <span id="filteredCount" style="display:none;"></span>
        </div>

        <ul class="list" id="list"></ul>
    </div>

    <div class="modal-overlay" id="modalOverlay" hidden>
        <div class="modal">
            <h2>단어 감지</h2>
            <p class="modal-msg" id="modalMsg"></p>
            <ul class="list" id="modalList"></ul>
            <div class="modal-actions">
                <button class="btn" id="modalAdd">추가</button>
                <button class="btn ghost" id="modalCancel">취소</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'endword.customWords.v1';
        let customWords = loadCustomWords();
        let searchQuery = '';
        let editingWord = null;
        let detectedWords = [];
        let modalEditingIndex = null;
        let isComposing = false;

        const $wordInput = document.getElementById('wordInput');
        const $submitBtn = document.getElementById('submitBtn');
        const $searchInput = document.getElementById('searchInput');
        const $error = document.getElementById('error');
        const $list = document.getElementById('list');
        const $count = document.getElementById('count');
        const $filteredCount = document.getElementById('filteredCount');
        const $modalOverlay = document.getElementById('modalOverlay');
        const $modalMsg = document.getElementById('modalMsg');
        const $modalList = document.getElementById('modalList');
        const $modalAdd = document.getElementById('modalAdd');
        const $modalCancel = document.getElementById('modalCancel');

        function loadCustomWords() {
            try {
                const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                const arr = Array.isArray(raw) ? raw : [];
                const cleaned = arr
                    .filter(w => typeof w === 'string')
                    .map(w => w.trim())
                    .filter(w => w.length >= 2 && !/\s/.test(w));
                const before = arr.length;
                const after = cleaned.length;
                if (before !== after) {
                    console.warn(`[custom-words] ${before - after}개의 잘못된 항목을 무시했습니다.`);
                }
                return [...new Set(cleaned)].sort((a, b) => a.localeCompare(b, 'ko'));
            } catch (e) {
                console.warn('[custom-words] localStorage 읽기 실패:', e);
                return [];
            }
        }

        function saveCustomWords() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(customWords));
            } catch (e) {
                showError('저장 실패: 브라우저 저장 공간이 부족하거나 차단되었습니다.');
            }
        }

        function showError(msg) {
            $error.textContent = msg;
            $error.classList.remove('ok');
            if (msg) {
                setTimeout(() => {
                    if ($error.textContent === msg) $error.textContent = '';
                }, 3000);
            }
        }

        function showNotice(msg) {
            $error.textContent = msg;
            $error.classList.add('ok');
            if (msg) {
                setTimeout(() => {
                    if ($error.textContent === msg) {
                        $error.textContent = '';
                        $error.classList.remove('ok');
                    }
                }, 3000);
            }
        }

        function validateWord(raw) {
            const w = (raw || '').trim();
            if (!w) return { ok: false, msg: '단어를 입력하세요.' };
            if (w.length < 2) return { ok: false, msg: '2글자 이상이어야 합니다.' };
            if (/\s/.test(w)) return { ok: false, msg: '공백 없이 한 단어만 입력하세요.' };
            if (customWords.includes(w)) return { ok: false, msg: '이미 추가된 단어입니다.' };
            return { ok: true, word: w };
        }

        function addWord(word) {
            const result = validateWord(word !== undefined ? word : $wordInput.value);
            if (!result.ok) { showError(result.msg); return; }
            customWords.push(result.word);
            customWords.sort((a, b) => a.localeCompare(b, 'ko'));
            saveCustomWords();
            $wordInput.value = '';
            autoResize();
            $wordInput.focus();
            render();
        }

        function submitInput() {
            const words = ($wordInput.value || '')
                .split(/\r?\n/)
                .map(s => s.trim())
                .filter(Boolean);
            if (words.length === 0) { showError('단어를 입력하세요.'); return; }
            if (words.length === 1) { addWord(words[0]); return; }
            detectedWords = words.slice();
            openModal();
        }

        function detectInput() {
            if (!$modalOverlay.hidden) return;
            const words = ($wordInput.value || '')
                .split(/\r?\n/)
                .map(s => s.trim())
                .filter(Boolean);
            if (words.length >= 2) {
                detectedWords = words.slice();
                openModal();
            }
        }

        function autoResize() {
            $wordInput.style.height = 'auto';
            $wordInput.style.height = $wordInput.scrollHeight + 'px';
        }

        function openModal() {
            $modalMsg.textContent = `${detectedWords.length}개의 단어가 감지되었습니다. 추가할까요?`;
            modalEditingIndex = null;
            $modalOverlay.hidden = false;
            renderModalList();
            $modalAdd.focus();
        }

        function closeModal(clearInput) {
            $modalOverlay.hidden = true;
            detectedWords = [];
            modalEditingIndex = null;
            if (clearInput) {
                $wordInput.value = '';
                autoResize();
                $wordInput.focus();
            }
        }

        function renderModalList() {
            if (detectedWords.length === 0) {
                $modalList.innerHTML = '<li class="empty-state">감지된 단어가 없습니다.</li>';
                return;
            }
            const items = detectedWords.map((word, idx) => {
                const isEditing = modalEditingIndex === idx;
                const wordHtml = isEditing
                    ? `<span class="word editing"><input id="medit-${idx}" type="text" value="${escapeHtml(word)}" autocomplete="off"></span>`
                    : `<span class="word">${escapeHtml(word)}</span>`;
                const actionHtml = isEditing
                    ? `<button class="btn-sm" data-act="save" data-index="${idx}">저장</button>
                       <button class="btn-sm" data-act="cancel" data-index="${idx}">취소</button>`
                    : `<button class="btn-sm" data-act="edit" data-index="${idx}">편집</button>
                       <button class="btn-sm danger" data-act="del" data-index="${idx}">삭제</button>`;
                return `<li class="item">${wordHtml}<div class="actions">${actionHtml}</div></li>`;
            }).join('');
            $modalList.innerHTML = items;
        }

        function saveModalEdit(idx, value, save) {
            if (save) {
                const v = (value || '').trim();
                if (v) detectedWords[idx] = v;
            }
            modalEditingIndex = null;
            renderModalList();
        }

        function commitDetected() {
            if (detectedWords.length === 0) {
                closeModal(true);
                showError('추가할 단어가 없습니다.');
                return;
            }
            const seen = new Set();
            let dup = 0, invalid = 0;
            const toAdd = [];
            for (const raw of detectedWords) {
                const w = (raw || '').trim();
                if (!w) continue;
                if (w.length < 2 || /\s/.test(w)) { invalid++; continue; }
                if (seen.has(w) || customWords.includes(w)) { dup++; continue; }
                seen.add(w);
                toAdd.push(w);
            }
            if (toAdd.length > 0) {
                customWords.push(...toAdd);
                customWords.sort((a, b) => a.localeCompare(b, 'ko'));
                saveCustomWords();
            }
            render();
            if (toAdd.length > 0) {
                let msg = `${toAdd.length}개 추가됨`;
                if (dup) msg += `, 중복 ${dup}개 제외`;
                if (invalid) msg += `, 잘못된 항목 ${invalid}개 제외`;
                closeModal(true);
                showNotice(msg);
            } else {
                closeModal(true);
                showNotice('추가된 단어가 없습니다 (모두 중복이거나 잘못된 항목)');
            }
        }

        function deleteWord(word) {
            if (!confirm(`'${word}' 을(를) 삭제할까요?`)) return;
            customWords = customWords.filter(w => w !== word);
            saveCustomWords();
            render();
        }

        function startEdit(word) {
            editingWord = word;
            render();
            // focus the edit input after render
            requestAnimationFrame(() => {
                const el = document.getElementById(`edit-${cssId(word)}`);
                if (el) { el.focus(); el.select(); }
            });
        }

        function finishEdit(oldWord, newRaw, save) {
            const newVal = (newRaw || '').trim();
            if (!save) { editingWord = null; render(); return; }
            if (!newVal || newVal === oldWord) { editingWord = null; render(); return; }
            if (newVal.length < 2) { showError('2글자 이상이어야 합니다.'); editingWord = null; render(); return; }
            if (/\s/.test(newVal)) { showError('공백 없이 한 단어만 입력하세요.'); editingWord = null; render(); return; }
            if (customWords.includes(newVal)) { showError('이미 추가된 단어입니다.'); editingWord = null; render(); return; }
            const idx = customWords.indexOf(oldWord);
            if (idx >= 0) customWords[idx] = newVal;
            customWords.sort((a, b) => a.localeCompare(b, 'ko'));
            saveCustomWords();
            editingWord = null;
            render();
        }

        function cssId(word) {
            // safe id from any Korean string
            return word.replace(/[^a-zA-Z0-9가-힣ㄱ-ㅎㅏ-ㅣ]/g, '_');
        }

        function render() {
            const visible = searchQuery
                ? customWords.filter(w => w.includes(searchQuery))
                : customWords;
            $count.textContent = `총 ${customWords.length}개`;
            if (searchQuery) {
                $filteredCount.style.display = '';
                $filteredCount.textContent = ` → 검색결과 ${visible.length}개`;
            } else {
                $filteredCount.style.display = 'none';
                $filteredCount.textContent = '';
            }

            if (customWords.length === 0) {
                $list.innerHTML = '<li class="empty-state">아직 추가된 단어가 없습니다.<br>위 입력창에 단어를 입력하고 Enter를 누르세요.</li>';
                return;
            }
            if (visible.length === 0) {
                $list.innerHTML = `<li class="empty-state">'${escapeHtml(searchQuery)}' 와(과) 일치하는 단어가 없습니다.</li>`;
                return;
            }

            const items = visible.map(word => {
                const isEditing = editingWord === word;
                const wordHtml = isEditing
                    ? `<span class="word editing"><input id="edit-${cssId(word)}" type="text" value="${escapeHtml(word)}" maxlength="20" autocomplete="off"></span>`
                    : `<span class="word">${escapeHtml(word)}</span>`;
                const actionHtml = isEditing
                    ? `<button class="btn-sm" data-act="save" data-word="${escapeHtml(word)}">저장</button>
                       <button class="btn-sm" data-act="cancel" data-word="${escapeHtml(word)}">취소</button>`
                    : `<button class="btn-sm" data-act="edit" data-word="${escapeHtml(word)}">편집</button>
                       <button class="btn-sm danger" data-act="del" data-word="${escapeHtml(word)}">삭제</button>`;
                return `<li class="item" data-word="${escapeHtml(word)}">${wordHtml}<div class="actions">${actionHtml}</div></li>`;
            }).join('');
            $list.innerHTML = items;
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Events
        $wordInput.addEventListener('input', autoResize);
        $wordInput.addEventListener('paste', () => {
            requestAnimationFrame(detectInput);
        });
        $wordInput.addEventListener('compositionstart', () => { isComposing = true; });
        $wordInput.addEventListener('compositionend', () => {
            isComposing = false;
            requestAnimationFrame(autoResize);
        });

        $wordInput.addEventListener('keydown', (e) => {
            if (e.isComposing || e.keyCode === 229) return;
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                submitInput();
                return;
            }
            if (e.key === 'Enter' && !e.shiftKey && !$wordInput.value.includes('\n')) {
                e.preventDefault();
                submitInput();
            }
        });

        $submitBtn.addEventListener('click', () => submitInput());

        $modalAdd.addEventListener('click', () => commitDetected());
        $modalCancel.addEventListener('click', () => closeModal(true));

        $modalOverlay.addEventListener('click', (e) => {
            if (e.target === $modalOverlay) closeModal(true);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !$modalOverlay.hidden) closeModal(true);
        });

        $modalList.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const idx = Number(btn.getAttribute('data-index'));
            const act = btn.getAttribute('data-act');
            if (act === 'edit') {
                modalEditingIndex = idx;
                renderModalList();
                requestAnimationFrame(() => {
                    const el = document.getElementById(`medit-${idx}`);
                    if (el) { el.focus(); el.select(); }
                });
            } else if (act === 'del') {
                detectedWords.splice(idx, 1);
                modalEditingIndex = null;
                renderModalList();
            } else if (act === 'save') {
                const input = document.getElementById(`medit-${idx}`);
                saveModalEdit(idx, input ? input.value : '', true);
            } else if (act === 'cancel') {
                saveModalEdit(idx, '', false);
            }
        });

        $modalList.addEventListener('keydown', (e) => {
            if (!e.target.matches('input[id^="medit-"]')) return;
            if (modalEditingIndex === null) return;
            if (e.key === 'Enter') {
                e.preventDefault();
                saveModalEdit(modalEditingIndex, e.target.value, true);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                saveModalEdit(modalEditingIndex, '', false);
            }
        });

        $searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        $list.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const word = btn.getAttribute('data-word');
            const act = btn.getAttribute('data-act');
            if (act === 'edit') startEdit(word);
            else if (act === 'del') deleteWord(word);
            else if (act === 'save') {
                const input = document.getElementById(`edit-${cssId(word)}`);
                if (input) finishEdit(word, input.value, true);
            } else if (act === 'cancel') {
                finishEdit(word, '', false);
            }
        });

        $list.addEventListener('keydown', (e) => {
            if (!e.target.matches('input[id^="edit-"]')) return;
            const id = e.target.id.slice('edit-'.length);
            const word = e.target.getAttribute('value') || (e.target.value);
            // Use the actual currently-editing word (from state) — the attribute may have been HTML-escaped identically
            const realWord = editingWord;
            if (e.key === 'Enter') {
                e.preventDefault();
                finishEdit(realWord, e.target.value, true);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                finishEdit(realWord, '', false);
            }
        });

        $list.addEventListener('focusout', (e) => {
            if (!e.target.matches('input[id^="edit-"]')) return;
            // Auto-save on blur only if input is still in DOM (clicked away vs deleted)
            setTimeout(() => {
                if (editingWord && document.activeElement && document.activeElement.id === `edit-${cssId(editingWord)}`) return;
                if (editingWord) finishEdit(editingWord, e.target.value, true);
            }, 0);
        }, true);

        render();
        autoResize();
    </script>
</body>
</html>
